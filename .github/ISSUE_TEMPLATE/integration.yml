name: Integration proposal
description: Propose connecting an AI agent to a device or service
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private account URLs, device IDs, raw logs, or network captures. See docs/adding-integrations.md for the contribution path.
  - type: input
    id: agent
    attributes:
      label: AI agent or agent service
    validations:
      required: true
  - type: input
    id: target
    attributes:
      label: Device or service
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Desired behavior and why it is useful
    validations:
      required: true
  - type: textarea
    id: path
    attributes:
      label: Proposed approach, connection, dependencies, costs, known limitations, and open questions
